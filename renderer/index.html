<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarioG - Super Platformer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">🍄 MARIO<span>G</span></div>
      <div class="hud">
        <span class="hud-item">Score: <b id="hud-score">0</b></span>
        <span class="hud-item">🪙 <b id="hud-coins">0</b></span>
        <span class="hud-item">❤️ <b id="hud-lives">3</b></span>
        <span class="hud-item">🏁 Lvl <b id="hud-level">1</b></span>
        <span class="hud-item best">🏆 Best: <b id="hud-best">0</b></span>
      </div>
    </header>

    <div class="stage">
      <canvas id="game" width="800" height="400"></canvas>

      <div id="overlay" class="overlay">
        <div class="overlay-box">
          <h2 id="overlay-title">🍄 MarioG</h2>
          <p id="overlay-text">Reach the flag 🏁 without running out of lives! Use arrow keys or WASD to move and Space to jump.</p>
          <button id="start-btn" class="btn-primary" type="button">Start Game</button>
          <p id="game-status" class="game-status"></p>
        </div>
      </div>
    </div>

    <div class="controls-help">
      <span><b>←</b> / <b>A</b> move left</span>
      <span><b>→</b> / <b>D</b> move right</span>
      <span><b>Space</b> / <b>↑</b> / <b>W</b> jump</span>
      <span>Stomp enemies, grab coins, reach the 🏁 flag!</span>
    </div>

    <footer class="footer">
      <p>VBUILD(TM) &mdash; MarioG Desktop v1.0.0</p>
    </footer>
  </div>

  <script src="game.js"></script>
  <script src="app.js"></script>
</body>
</html>
